name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Both registries trust OIDC tokens from this environment only
    environment: release
    permissions:
      contents: write # GitHub release via changelogithub
      id-token: write # OIDC for Azure login and Open VSX trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changelogithub needs the tag history
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # No dependency cache in a job that can mint publishing tokens
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package extension
        run: pnpm run package --out toon.vsix

      - name: Generate changelog and create GitHub release
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to VS Code Marketplace
        run: pnpm exec vsce publish --packagePath toon.vsix --azure-credential

      - name: Publish to Open VSX
        run: pnpm exec ovsx publish toon.vsix --trusted-publishing
